name: CI

on:
  push:
    branches: [main, revamp]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: npm ci --workspace server --include-workspace-root
        working-directory: .
      - run: npm run lint
      - run: npx jest --runInBand --coverage --coverageReporters=text-summary --coverageReporters=text
        env:
          NODE_ENV: test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace client --include-workspace-root
        working-directory: .
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
      - run: npm run lint
      - run: npm test
      - run: npm run build
